name: Check
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: engine/generated
          key: native-${{ runner.os }}-${{ hashFiles('engine/upstream/SHA256SUMS', 'engine/patches/build_native.py', 'engine/patches/hyperbackup_host.rs') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install fixed native toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager 'ndk;30.0.16248370'
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android
      - name: Source and narrow bridge checks
        run: |
          python3 -m unittest discover -s engine/tests -v
          python3 ci/check_source.py
          python3 ci/upstream_audit.py
          python3 ci/check_coverage.py
          python3 -m unittest discover -s ci/tests -v
      - name: Build patched native host from pinned source
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          python3 engine/patches/build_native.py
      - name: Verify native provenance
        run: python3 ci/verify_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-host
          path: engine/generated/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-audit
          path: work/upstream-audit.json
  contracts-and-apk:
    needs: native-host
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: native-host
          path: engine/generated
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Verify upstream and repository boundaries
        run: python3 ci/check_source.py
      - name: Unit contracts, archive attacks, transport failures, lint and APK
        run: bash ci/gradle.sh :core:domain:test :core:engine:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --console=plain
      - name: Check packaged JNI 16 KB compatibility
        run: python3 ci/check_native_alignment.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-and-check-results
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/outputs/mapping/
            core/domain/build/reports/tests/
            core/engine/build/reports/tests/
  real-storage:
    needs: native-host
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HYPERBACKUP_TEST_DAV: http://127.0.0.1:8081/
      HYPERBACKUP_TEST_SMB: smb://127.0.0.1:1445/backup
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: native-host
          path: engine/generated
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Start isolated WebDAV and Samba fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y samba
          python3 -m venv work/venv
          work/venv/bin/pip install WsgiDAV==4.3.3 cheroot==11.0.0
          python3 ci/setup_samba.py
          work/venv/bin/python ci/webdav_fixture.py >work/webdav.log 2>&1 &
          for n in $(seq 1 30); do curl -s -u ci:fixture-only http://127.0.0.1:8081/ >/dev/null && break; sleep 1; done
      - name: Exercise real protocol repositories
        run: bash ci/gradle.sh :core:engine:testDebugUnitTest --tests '*RemoteRepositoryTest' --rerun-tasks --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-contract-results
          path: |
            core/engine/build/reports/tests/
            work/*.log
  android-ui:
    needs: native-host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: native-host
          path: engine/generated
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash ci/android_ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api }}-ui-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            work/ui-evidence/
  avdlite:
    needs: native-host
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: native-host
          path: engine/generated
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache/restore@v4
        id: avdlite-cache
        with:
          path: work/avdlite-cache
          key: avdlite-${{ runner.os }}-${{ hashFiles('ci/avdlite.lock.json') }}
      - name: Verify and import pinned KernelSU image
        run: python3 ci/avdlite.py prepare --sdk "$ANDROID_HOME"
      - uses: actions/cache/save@v4
        if: steps.avdlite-cache.outputs.cache-hit != 'true'
        with:
          path: work/avdlite-cache
          key: avdlite-${{ runner.os }}-${{ hashFiles('ci/avdlite.lock.json') }}
      - name: Build R8 test APKs before starting the emulator
        run: bash ci/gradle.sh -PciUi=true :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Check arm64 and x86_64 JNI 16 KB compatibility
        run: python3 ci/check_native_alignment.py app/build/outputs/apk/debug/app-debug.apk
      - name: Root, reboot, SELinux, pinned Dex and UI scenarios
        run: python3 ci/avdlite.py run --sdk "$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avdlite-platform-and-ui-results
          path: |
            work/avdlite/evidence/
            work/avdlite/image-manifest.json
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
  required-checks:
    if: always()
    needs: [native-host, contracts-and-apk, real-storage, android-ui, avdlite]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every scenario
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required checks did not pass: {failed}')
          print('All required checks passed')
          PYCODE
