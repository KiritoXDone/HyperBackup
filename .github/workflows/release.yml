name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/check.yml
  signed-apk:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: native-host
          path: engine/generated
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Validate version, changelog and formal release coverage
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            python3 ci/release.py prepare --tag "$REF_NAME"
          else
            python3 ci/release.py prepare
          fi
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HYPERBACKUP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hyperbackup.p12"
      - name: Build optimized signed APK
        env:
          HYPERBACKUP_KEYSTORE_PATH: ${{ runner.temp }}/hyperbackup.p12
          HYPERBACKUP_KEYSTORE_PASSWORD: ${{ secrets.HYPERBACKUP_KEYSTORE_PASSWORD }}
        run: bash ci/gradle.sh :app:assembleRelease :app:lintRelease --console=plain
      - name: Verify APK identity, certificate and native provenance
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            python3 ci/release.py package --tag "$REF_NAME"
          else
            python3 ci/release.py package
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          if-no-files-found: error
          path: work/release/
      - uses: actions/upload-artifact@v4
        with:
          name: release-r8-mapping
          if-no-files-found: error
          path: app/build/outputs/mapping/release/
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hyperbackup.p12"
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: signed-apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: release
      - name: Publish APK, checksums and notes together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --title "HyperBackup ${TAG#v}" --notes-file release/notes.md)
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" release/*.apk release/SHA256SUMS release/provenance.json "${args[@]}"
